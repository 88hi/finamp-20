name: Android Cast Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name'
        required: true
        default: 'v1.1.0-cast.1'

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Determine Flutter version
        id: flutter-version
        uses: ./.github/actions/flutter-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
          pub-cache: true

      - name: Restore persistent Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Error: ANDROID_KEYSTORE_BASE64 secret is not configured!" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=$(pwd)/android/release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          TAG="${{ github.event.inputs.tag || 'v1.1.0-cast.2' }}"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "finamp-android-${TAG}.apk"
          sha256sum "finamp-android-${TAG}.apk"

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || 'v1.1.0-cast.2' }}"
          APK_NAME="finamp-android-${TAG}.apk"
          SHA=$(sha256sum "$APK_NAME" | awk '{print $1}')
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$APK_NAME" \
            --target "${{ github.ref_name }}" \
            --title "Finamp ${TAG} (Android 投屏版)" \
            --notes "## 更新内容
          - 修复投屏设备列表发现问题：移除 \`activeWithinSeconds=960\` 过滤（与 Jellyfin 官方网页一致），空闲待机状态下的 Supersonic 等客户端无需先放歌也能立即被识别
          - 修复本机设备自身出现在投屏列表中的问题（正确匹配 Android/iOS 带后缀的 \`DeviceId\`）
          - 优化大队列投屏的单次发送上限（\`_maxRemotePlayItems = 50\`），避免 URL 过长导致 \`Connection closed before full header was received\` 报错

          ## Android 安装包
          - 文件名：\`$APK_NAME\`
          - 已签名（Release 版本），下载后可直接在 Android 设备安装
          - SHA-256：\`$SHA\`"
