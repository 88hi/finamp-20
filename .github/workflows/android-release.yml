name: Android Cast Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name'
        required: true
        default: 'v1.1.0-cast.1'

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Determine Flutter version
        id: flutter-version
        uses: ./.github/actions/flutter-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
          pub-cache: true

      - name: Generate Android signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias finamp \
            -storepass finamp123 -keypass finamp123 \
            -dname "CN=Finamp, OU=Finamp, O=Finamp, L=Local, S=Local, C=US"
          cat > android/key.properties <<EOF
          storePassword=finamp123
          keyPassword=finamp123
          keyAlias=finamp
          storeFile=$(pwd)/android/release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk finamp-android-cast-v1.1.0.apk
          sha256sum finamp-android-cast-v1.1.0.apk

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || 'v1.1.0-cast.1' }}"
          SHA=$(sha256sum finamp-android-cast-v1.1.0.apk | awk '{print $1}')
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" finamp-android-cast-v1.1.0.apk \
            --target "${{ github.ref_name }}" \
            --title "Finamp v1.1.0 (Android 投屏版)" \
            --notes "## 新增功能
          - 新增 Jellyfin 投屏 / 远程控制（Play On）功能，像 Jellyfin 官方播放器一样控制同一服务器上的其他设备播放音乐
          - 支持发现可控制设备、连接/切换/断开、同步当前播放队列
          - 支持远程播放/暂停、上一首/下一首、停止、进度拖动、随机/循环模式、音量调节与静音、查看设备播放队列
          - 主界面顶部栏、播放页顶部栏及输出菜单均已集成投屏入口，投屏时底部播放栏自动切换为远程控制条

          ## Android 安装包
          - 文件名：\`finamp-android-cast-v1.1.0.apk\`
          - 已签名（Release 版本），下载后可直接在 Android 设备安装
          - SHA-256：\`$SHA\`"
